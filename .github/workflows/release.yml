name: Release

on:
  push:
    tags:
      # Accept a version tag with or without a leading v.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  XCODE_VERSION: '27.0'

jobs:
  build:
    # Xcode 27 carries Swift 6.4 and the macOS 27 SDK, which the manifest needs.
    # No macos-27 runner label exists yet, so the xcode-27 preview image is the
    # only hosted image that holds them. Its host still runs macOS 26.5, which
    # runs a macOS 27 binary all the same.
    runs-on: xcode-27

    # Every toba package reads TOBA_STATIC_LINK and drops its .dynamic product
    # type when the variable is set. xc-mcp is one executable image, so a static
    # link removes the @rpath dylibs the release would otherwise have to carry.
    # The variable sits on the job because SwiftPM evaluates the manifest during
    # resolve as well as during build, and the two must agree.
    env:
      TOBA_STATIC_LINK: '1'

    steps:
    - uses: actions/checkout@v4
      with:
        # The release notes step reads every tag and the log between two of them.
        # The default shallow clone carries one commit and one tag, so fetch it all.
        fetch-depth: 0

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    # The four toba packages are private. SwiftPM clones them over https with
    # no credential, so the rewrite supplies one. Each rewrite names one
    # repository, which keeps the credential off every other toba URL.
    - name: Authenticate to the private toba repositories
      env:
        TOBA_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        for repo in toba-core toba-concurrency toba-hash toba-testing; do
          git config --global \
            url."https://x-access-token:${TOBA_TOKEN}@github.com/toba/${repo}".insteadOf \
            "https://github.com/toba/${repo}"
        done

    # The cap turns a stalled artifact download into a fast failure. A stall
    # otherwise holds the runner for the full six hour job limit. The two
    # flags stop SwiftPM from consulting the keychain and netrc, because that
    # lookup blocks on a headless runner.
    - name: Resolve dependencies
      timeout-minutes: 10
      run: swift package resolve --disable-keychain --disable-netrc

    - name: Build release binaries
      run: swift build -c release --disable-sandbox

    # The staged layout is bin/, plus lib/ when the build produced a dylib. TOBA_STATIC_LINK
    # is set above, so the static link leaves no dylib and the script drops lib/ and the rpath.
    - name: Stage the release
      run: scripts/stage-release.sh "$(swift build -c release --show-bin-path)" dist

    # Runs every executable in the staged layout. A missing dylib fails the release here
    # rather than on the first machine that installs it.
    - name: Verify the staged release
      run: scripts/verify-release.sh dist

    - name: Create archive
      run: tar -czvf xc-mcp-${{ github.ref_name }}-arm64.tar.gz -C dist .

    - name: Generate SHA256
      run: shasum -a 256 xc-mcp-${{ github.ref_name }}-arm64.tar.gz > xc-mcp-${{ github.ref_name }}-arm64.tar.gz.sha256

    - name: Generate release notes
      id: release_notes
      run: |
        # Find the previous release tag. Tags carry either form, "1.2.3" or "v1.2.3",
        # so sort on the version alone and keep the original name in a second field.
        # Skip every tag whose version equals the current one. That drops the other
        # prefix form of this same release.
        CURRENT_VERSION="${GITHUB_REF_NAME#v}"
        PREV_TAG=$(git tag --list \
          | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed -E 's/^v?(.*)$/\1\t&/' \
          | sort -Vr \
          | awk -F'\t' -v cur="$CURRENT_VERSION" '$1 != cur { print $2; exit }')
        if [ -z "$PREV_TAG" ]; then
          # First release, get all commits
          NOTES=$(git log --pretty=format:"- %s" HEAD)
        else
          # Get commits since previous tag
          NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
        fi
        # Write to file to preserve newlines
        echo "$NOTES" > release_notes.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          xc-mcp-${{ github.ref_name }}-arm64.tar.gz
          xc-mcp-${{ github.ref_name }}-arm64.tar.gz.sha256
        body_path: release_notes.txt

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          SHA=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "xc-mcp-${TAG}-arm64.tar.gz.sha256" -O - | awk '{print $1}')

          # Clone tap and update formula
          git clone "https://x-access-token:${GH_TOKEN}@github.com/toba/homebrew-tap.git" tap
          cd tap

          cat > Formula/xc-mcp.rb << 'FORMULA'
          class XcMcp < Formula
            desc "MCP server for Xcode development - build, test, run, and debug iOS/macOS apps"
            homepage "https://github.com/toba/xc-mcp"
            url "URL_PLACEHOLDER"
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"
            license "MIT"

            depends_on :macos => :golden_gate
            depends_on arch: :arm64

            SERVERS = %w[xc-build xc-debug xc-device xc-project xc-simulator xc-strings xc-swift].freeze

            def install
              # The release links the toba packages static, so the glob is empty. It stays
              # because a release built without TOBA_STATIC_LINK ships dylibs the executable
              # reaches through an rpath of @loader_path/../lib.
              lib.install Dir["lib/*.dylib"]
              bin.install "bin/xc-mcp"
              SERVERS.each do |name|
                bin.install_symlink "xc-mcp" => name
              end
            end

            def caveats
              <<~EOS
                xc-mcp requires Xcode for xcodebuild, simctl, and devicectl.

                Configure with Claude Code:
                  claude mcp add xc-mcp -- #{bin}/xc-mcp

                Focused servers available: xc-project, xc-simulator, xc-device, xc-debug, xc-swift, xc-build, xc-strings
              EOS
            end

            # Every name is checked, not xc-mcp alone. The eight share one binary and one
            # link line, so a missing dylib stops all of them.
            test do
              (["xc-mcp"] + SERVERS).each do |name|
                assert_match "MCP server", shell_output("#{bin}/#{name} --help")
              end
            end
          end
          FORMULA

          # Remove heredoc indentation and substitute placeholders
          sed -i 's/^          //' Formula/xc-mcp.rb
          sed -i "s|URL_PLACEHOLDER|https://github.com/toba/xc-mcp/releases/download/${TAG}/xc-mcp-${TAG}-arm64.tar.gz|" Formula/xc-mcp.rb
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|" Formula/xc-mcp.rb
          sed -i "s|SHA_PLACEHOLDER|${SHA}|" Formula/xc-mcp.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/xc-mcp.rb
          git commit -m "bump to ${VERSION}"
          git push
