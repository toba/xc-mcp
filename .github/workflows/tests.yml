name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: macos-26
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show Swift version
      run: swift --version
    
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: .build
        # The workflow file joins the key because a failed resolve saves a
        # .build that holds half-cloned repositories. Editing the workflow
        # then retires that entry instead of restoring it.
        key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', '.github/workflows/tests.yml') }}
        restore-keys: |
          ${{ runner.os }}-swift-

    # The four toba packages are private. SwiftPM clones them over https with
    # no credential, so the rewrite supplies one. A fork pull request gets no
    # secret and still fails here. Each rewrite names one repository, which
    # keeps the credential off every other toba URL.
    - name: Authenticate to the private toba repositories
      env:
        TOBA_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        for repo in toba-core toba-concurrency toba-hash toba-testing; do
          git config --global \
            url."https://x-access-token:${TOBA_TOKEN}@github.com/toba/${repo}".insteadOf \
            "https://github.com/toba/${repo}"
        done

    # The cap turns a stalled artifact download into a fast failure. A stall
    # otherwise holds the runner for the full six hour job limit.
    #
    # The binary artifact of swiftiomatic-plugins sits on a public release, so
    # it needs no credential. The two flags stop SwiftPM from consulting the
    # keychain and netrc for one, because that lookup blocks on a headless
    # runner and the download then never starts.
    - name: Resolve dependencies
      timeout-minutes: 10
      run: swift package resolve --disable-keychain --disable-netrc

    - name: Run tests
      run: swift test

    - name: Verify all executables build
      run: swift build